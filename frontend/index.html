<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Motion Platform</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <header class="hero">

        <h1>AI Motion Platform</h1>

        <p class="subtitle">
            AI-powered Badminton Footwork Analysis
        </p>

    </header>

    <main class="card">

        <section class="upload-section">

            <h2>Upload Video</h2>

            <input
                type="file"
                id="videoInput"
                accept="video/*">

            <button id="analyzeButton">
                Start Analysis
            </button>

        </section>

        <section class="status-section">

            <h2>Status</h2>

            <div id="statusText">

                Waiting...

            </div>

        </section>

        <section class="progress-section">

            <h2>Progress</h2>

            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill">
                </div>

            </div>

        </section>

    </main>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>
</html>
